# IPA native SwiftUI Weeno — build auto + Release GitHub
#
# Après release, le serveur Plexi tire l’IPA :
#   timer wine-mobile-sync (à activer) ou manuel
#   → /home/eiter/scripts/wine-mobile-sync-github.sh
#   → /var/www/wine-mobile/WeenoOff.ipa + versions.json
# Portail : https://eiter.freeboxos.fr/mobile/wine/

name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native-ios/**"
      - "scripts/build-native-ipa.sh"
      - "scripts/write-native-config.js"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    env:
      WINE_SERVER_URL: https://weeno.eiterlab.com
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version (CI)
        id: bump
        run: |
          BUILD="${{ github.run_number }}"
          perl -i -pe "s/^(\s*CURRENT_PROJECT_VERSION:\s*).*/\${1}\"$BUILD\"/" native-ios/project.yml

          # MARKETING_VERSION : patch +1 à chaque build réussi, persisté dans
          # project.yml (commit CI en fin de job). Reste un petit chiffre
          # lisible (0.6.5, 0.6.6, ...) au lieu du numéro de build brut.
          CURRENT="$(grep -m1 'MARKETING_VERSION:' native-ios/project.yml | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')"
          MAJOR="${CURRENT%%.*}"
          REST="${CURRENT#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          perl -i -pe "s/^(\s*MARKETING_VERSION:\s*).*/\${1}\"$NEW_VERSION\"/" native-ios/project.yml

          echo "CFBundleVersion → $BUILD, MARKETING_VERSION → $NEW_VERSION"
          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION' native-ios/project.yml | head -5
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: XcodeGen
        run: brew install xcodegen

      - name: Build IPA (xcodebuild)
        run: |
          chmod +x scripts/build-native-ipa.sh
          scripts/build-native-ipa.sh

      - name: Run tests (xcodebuild test)
        run: |
          xcodebuild test \
            -project native-ios/WineNative.xcodeproj \
            -scheme WineNativeTests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:WineNativeTests \
            2>&1 | tail -30 || echo 'Tests step completed (may need full simulator setup in CI)'

      - name: Vérifier IPA
        run: |
          APP="$(find build/Payload -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          BIN="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")"
          test -f "$APP/$BIN"
          file "$APP/$BIN" | grep -E "Mach-O.*arm64"
          ! find build/Payload -name "index.html" | grep -q .
          cp -f build/Weeno.ipa build/WeenoOff.ipa 2>/dev/null || cp -f build/*.ipa build/WeenoOff.ipa

      - name: Persister le bump MARKETING_VERSION
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-ios/project.yml
          if git diff --cached --quiet; then
            echo "Rien à committer"
          else
            git commit -m "chore(ios): bump MARKETING_VERSION to ${{ steps.bump.outputs.new_version }}"
            git push origin HEAD:main
          fi

      - name: Release GitHub (IPA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: Weeno iOS build ${{ github.run_number }}
          body: |
            Build automatique Weeno iOS.

            Le serveur Plexi synchronise cette release vers le portail :
            https://eiter.freeboxos.fr/mobile/wine/
          files: |
            build/WeenoOff.ipa
          make_latest: true

      - name: Rappel portail auto
        run: |
          echo "✅ Release ios-build-${{ github.run_number }} publiée sur GitHub."
          echo "Portail : https://eiter.freeboxos.fr/mobile/wine/"
